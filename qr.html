<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态二维码</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff;flex-direction:column;}
        #qrcode{width:320px;height:320px;margin-bottom:20px;}
        .tip{font-size:16px;color:#666;margin-top:10px;}
    </style>
</head>
<body>
    <div id="qrcode"></div>
    <div class="tip">二维码每30秒刷新一次，旧码自动失效</div>

    <script>
        // 你的 GitHub 地址 + verify.html
        const verifyPage = "https://fomlaw.github.io/verify.html";
        
        // 最终要跳转的携程链接
        const realUrl = "https://jr.ctrip.com/m/adno/page/hotelBusinessLoan?isHideNavBar=YES&disable_redirect_https=1&mktype=CYJRJDJYD1";

        // 生成当前时间段的标识（30秒一个段）
        function getTimeSlot(){
            return Math.floor(Date.now() / 30000).toString();
        }

        function refresh(){
            const slot = getTimeSlot();
            const qrContent = `${verifyPage}?slot=${slot}&url=${encodeURIComponent(realUrl)}`;
            
            const qrImg = "https://api.qrserver.com/v1/create-qr-code/?" +
                "size=320x320&margin=4&data=" + encodeURIComponent(qrContent);

            document.getElementById("qrcode").innerHTML = `<img src="${qrImg}">`;
        }

        refresh();
        setInterval(refresh, 30000);
    </script>
</body>
</html>
