<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证中...</title>
    <style>
        body{display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;font-family:Arial,sans-serif;}
        .box{text-align:center;padding:30px;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0002;}
        .ok{color:#28a745;font-size:20px;}
        .err{color:#dc3545;font-size:20px;}
    </style>
</head>
<body>
<div class="box" id="msg">验证中...</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const t = parseInt(urlParams.get("t"));
    const k = urlParams.get("k");
    const r = urlParams.get("r");
    const now = Date.now();
    const expire = 30 * 1000; // 30秒有效期

    // 从本地取出当前有效key（和展示页同源，可共享localStorage）
    const validKey = localStorage.getItem("validKey");
    const validTime = parseInt(localStorage.getItem("validTime")) || 0;

    const msgEl = document.getElementById("msg");

    if (!t || !k || !r) {
        msgEl.innerHTML = `<div class="err">参数错误</div>`;
    } else if (now - t > expire) {
        msgEl.innerHTML = `<div class="err">二维码已过期，请刷新</div>`;
    } else if (k !== validKey || t < validTime) {
        msgEl.innerHTML = `<div class="err">二维码已失效，请刷新</div>`;
    } else {
        msgEl.innerHTML = `<div class="ok">验证通过，跳转中...</div>`;
        setTimeout(() => window.location.href = decodeURIComponent(r), 800);
    }
</script>
</body>
</html>
