<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证中</title>
    <style>
        body{display:flex;justify-content:center;align-items:center;height:100vh;background:#fff;font-family:Arial,sans-serif;}
        .box{text-align:center;padding:30px;}
        .ok{color:#00a63d;font-size:18px;}
        .fail{color:#f44336;font-size:18px;}
    </style>
</head>
<body>
<div class="box" id="msg"></div>

<script>
    const params = new URLSearchParams(location.search);
    const slot = params.get("slot");
    const url = params.get("url");
    const msg = document.getElementById("msg");

    // 当前时间段（30秒）
    const nowSlot = Math.floor(Date.now() / 30000).toString();

    if (!slot || !url) {
        msg.innerHTML = '<div class="fail">二维码无效</div>';
    }
    // 只允许当前30秒的码有效
    else if (slot === nowSlot) {
        msg.innerHTML = '<div class="ok">验证成功，正在跳转...</div>';
        setTimeout(()=>location.href = decodeURIComponent(url), 700);
    }
    else {
        msg.innerHTML = '<div class="fail">二维码已过期，请刷新页面</div>';
    }
</script>
</body>
</html>
